name: HosPrime CI

on:
  pull_request:
  push:
    branches:
      - main
      - governance-project-control-v1

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      JWT_SECRET: ci-only-random-secret-with-more-than-32-characters
      GEMINI_API_KEY: ""
      ALLOW_DEMO_FALLBACKS: "false"
      ALLOW_PSEUDO_EMBEDDINGS: "false"
      DATABASE_URL: sqlite:///./ci-hosprime.db
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -q -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run governance safety tests
        run: pytest backend/tests/test_governance_safety.py -vv --tb=short
      - name: Import application
        run: python -c "from backend.app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
