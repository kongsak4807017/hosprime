name: HosPrime CI

on:
  pull_request:
  push:
    branches: [main, loop-engineering-memory-v1]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      JWT_SECRET: ci-only-random-secret-with-more-than-32-characters
      GEMINI_API_KEY: ""
      ALLOW_DEMO_FALLBACKS: "false"
      ALLOW_PSEUDO_EMBEDDINGS: "false"
      DATABASE_URL: sqlite:///./ci-hosprime.db
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -q -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: pytest backend/tests -q --tb=short
      - run: python -c "from backend.app.memory import PersonalGraphStore; from backend.app.engineering_loop import LoopRunStore"
      - run: python -c "from backend.app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
