name: M0 secure runtime configuration

on:
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "scripts/bootstrap.sh"
      - "scripts/bootstrap.ps1"
      - "scripts/healthcheck.sh"
      - "scripts/healthcheck.ps1"
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/app/core/config.py"
      - "backend/app/db/bootstrap.py"
      - "backend/app/db/safe_bootstrap.py"
      - "backend/app/db/session.py"
      - "backend/app/main.py"
      - "backend/tests/test_secure_runtime_config.py"
      - "backend/tests/test_deploy_scripts.py"
      - "backend/tests/test_deploy_source_provenance.py"
      - "backend/tests/test_deploy_env_creation_guard.py"
      - "backend/tests/test_deploy_windows_acl_contract.py"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/m0-secure-runtime-test.yml"
  pull_request:
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "scripts/bootstrap.sh"
      - "scripts/bootstrap.ps1"
      - "scripts/healthcheck.sh"
      - "scripts/healthcheck.ps1"
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/app/core/config.py"
      - "backend/app/db/bootstrap.py"
      - "backend/app/db/safe_bootstrap.py"
      - "backend/app/db/session.py"
      - "backend/app/main.py"
      - "backend/tests/test_secure_runtime_config.py"
      - "backend/tests/test_deploy_scripts.py"
      - "backend/tests/test_deploy_source_provenance.py"
      - "backend/tests/test_deploy_env_creation_guard.py"
      - "backend/tests/test_deploy_windows_acl_contract.py"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/m0-secure-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSPRIME_COMPOSE_PROJECT_NAME: hosprime-ci

jobs:
  secure-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate deploy script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap.sh scripts/healthcheck.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/bootstrap.ps1", [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }'
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/healthcheck.ps1", [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }'

      - name: Run secure runtime and deploy regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_secure_runtime_config.py \
            backend/tests/test_deploy_scripts.py \
            backend/tests/test_deploy_source_provenance.py \
            backend/tests/test_deploy_env_creation_guard.py \
            backend/tests/test_deploy_windows_acl_contract.py

      - name: Create ephemeral CI environment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import secrets
          from pathlib import Path
          from urllib.parse import quote

          postgres_password = secrets.token_urlsafe(32)
          neo4j_password = secrets.token_urlsafe(32)
          jwt_secret = secrets.token_urlsafe(48)
          admin_password = secrets.token_urlsafe(32)
          encoded_postgres_password = quote(postgres_password, safe="")

          values = {
              "ENVIRONMENT": "development",
              "POSTGRES_DB": "hosprime",
              "POSTGRES_USER": "hosprime",
              "POSTGRES_PASSWORD": postgres_password,
              "POSTGRES_PORT": "15432",
              "DATABASE_URL": f"postgresql://hosprime:{encoded_postgres_password}@postgres:5432/hosprime",
              "POSTGRES_URL": f"postgresql://hosprime:{encoded_postgres_password}@postgres:5432/hosprime",
              "REDIS_URL": "redis://redis:6379/0",
              "REDIS_PORT": "16379",
              "NEO4J_URI": "bolt://neo4j:7687",
              "NEO4J_USER": "neo4j",
              "NEO4J_PASSWORD": neo4j_password,
              "NEO4J_HTTP_PORT": "17474",
              "NEO4J_BOLT_PORT": "17687",
              "GEMINI_API_KEY": "",
              "JWT_SECRET": jwt_secret,
              "BOOTSTRAP_ADMIN_USERNAME": "ci-admin",
              "BOOTSTRAP_ADMIN_PASSWORD": admin_password,
              "SEED_DEMO_DATA": "false",
              "CORS_ORIGINS": '["http://localhost:18080"]',
              "BACKEND_PORT": "18000",
              "FRONTEND_PORT": "18080",
          }

          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          chmod 600 .env

      - name: Build, start and verify exact-source Compose stack
        shell: bash
        run: HOSPRIME_ENV_FILE="$PWD/.env" bash scripts/bootstrap.sh

      - name: Verify backend liveness and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:18000/health/live | tee /tmp/hosprime-health-live.json
          echo
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready | tee /tmp/hosprime-health-ready.json
          echo
          python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path("/tmp/hosprime-health-live.json").read_text())
          ready = json.loads(Path("/tmp/hosprime-health-ready.json").read_text())
          assert live.get("status") == "live", live
          assert ready.get("status") == "ready", ready
          assert ready.get("database_dialect") == "postgresql", ready
          PY

      - name: Verify idempotent bootstrap preserves data and credentials
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose --project-name "$HOSPRIME_COMPOSE_PROJECT_NAME" --env-file .env "$@"
          }

          compose exec -T postgres psql -U hosprime -d hosprime -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS bootstrap_restart_probe (
            id integer PRIMARY KEY,
            value text NOT NULL
          );
          INSERT INTO bootstrap_restart_probe (id, value)
          VALUES (1, 'preserve-me')
          ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
          SQL

          before_hash="$(compose exec -T postgres psql -U hosprime -d hosprime -Atc "SELECT hashed_password FROM users WHERE username='ci-admin';")"
          test -n "$before_hash"

          compose restart backend
          timeout 180 bash -c 'until curl --fail --silent http://127.0.0.1:18000/health/ready >/dev/null; do sleep 3; done'

          preserved="$(compose exec -T postgres psql -U hosprime -d hosprime -Atc "SELECT value FROM bootstrap_restart_probe WHERE id=1;")"
          after_hash="$(compose exec -T postgres psql -U hosprime -d hosprime -Atc "SELECT hashed_password FROM users WHERE username='ci-admin';")"
          admin_count="$(compose exec -T postgres psql -U hosprime -d hosprime -Atc "SELECT count(*) FROM users WHERE username='ci-admin';")"

          test "$preserved" = "preserve-me"
          test "$before_hash" = "$after_hash"
          test "$admin_count" = "1"

      - name: Verify frontend HTTP availability
        run: |
          curl --fail --silent --show-error --output /tmp/hosprime-frontend.html http://127.0.0.1:18080/
          test -s /tmp/hosprime-frontend.html

      - name: Record running service state
        run: docker compose --project-name "$HOSPRIME_COMPOSE_PROJECT_NAME" --env-file .env ps

      - name: Capture Compose diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/hosprime-compose-diagnostics
          compose=(docker compose --project-name "$HOSPRIME_COMPOSE_PROJECT_NAME" --env-file .env)
          "${compose[@]}" ps --all > /tmp/hosprime-compose-diagnostics/compose-ps.txt 2>&1 || true
          "${compose[@]}" logs --no-color --timestamps --tail=300 > /tmp/hosprime-compose-diagnostics/compose-logs.txt 2>&1 || true
          mapfile -t container_ids < <("${compose[@]}" ps -q | sort -u)
          if ((${#container_ids[@]})); then
            docker inspect "${container_ids[@]}" > /tmp/hosprime-compose-diagnostics/docker-inspect.json 2>&1 || true
          fi
          cat /tmp/hosprime-compose-diagnostics/compose-ps.txt
          tail -n 120 /tmp/hosprime-compose-diagnostics/compose-logs.txt || true

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosprime-compose-diagnostics
          path: /tmp/hosprime-compose-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Stop complete Compose stack
        if: always()
        run: docker compose --project-name "$HOSPRIME_COMPOSE_PROJECT_NAME" --env-file .env down --volumes --remove-orphans || true

      - name: Remove ephemeral environment
        if: always()
        run: rm -f .env
