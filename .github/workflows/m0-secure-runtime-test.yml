name: M0 secure runtime configuration

on:
  push:
    branches:
      - security/m0-secure-runtime-config
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "backend/app/core/config.py"
      - "backend/app/main.py"
      - "backend/tests/test_secure_runtime_config.py"
      - ".github/workflows/m0-secure-runtime-test.yml"
  pull_request:
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "backend/app/core/config.py"
      - "backend/app/main.py"
      - "backend/tests/test_secure_runtime_config.py"
      - ".github/workflows/m0-secure-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run secure runtime regression tests
        run: python -m pytest -q backend/tests/test_secure_runtime_config.py

      - name: Create ephemeral CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=development
          POSTGRES_DB=hosprime
          POSTGRES_USER=hosprime
          POSTGRES_PASSWORD=ci-postgres-password-not-for-production
          POSTGRES_PORT=15432
          DATABASE_URL=postgresql://hosprime:ci-postgres-password-not-for-production@postgres:5432/hosprime
          POSTGRES_URL=postgresql://hosprime:ci-postgres-password-not-for-production@postgres:5432/hosprime
          REDIS_URL=redis://redis:6379/0
          REDIS_PORT=16379
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ci-neo4j-password-not-for-production
          NEO4J_HTTP_PORT=17474
          NEO4J_BOLT_PORT=17687
          GEMINI_API_KEY=ci-provider-key-not-for-production
          JWT_SECRET=ci-only-jwt-secret-with-more-than-thirty-two-characters
          CORS_ORIGINS=["http://localhost:18080"]
          BACKEND_PORT=18000
          FRONTEND_PORT=18080
          EOF

      - name: Validate resolved Compose model
        run: docker compose --env-file .env config --quiet

      - name: Build deployable images
        run: docker compose --env-file .env build

      - name: Start complete Compose stack and wait for health
        run: docker compose --env-file .env up --detach --wait --wait-timeout 240

      - name: Verify backend liveness and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:18000/health/live | tee /tmp/hosprime-health-live.json
          echo
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready | tee /tmp/hosprime-health-ready.json
          echo
          python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path("/tmp/hosprime-health-live.json").read_text())
          ready = json.loads(Path("/tmp/hosprime-health-ready.json").read_text())
          assert live.get("status") == "live", live
          assert ready.get("status") in {"ready", "degraded"}, ready
          assert ready.get("database_dialect") == "postgresql", ready
          PY

      - name: Verify frontend HTTP availability
        run: |
          curl --fail --silent --show-error --output /tmp/hosprime-frontend.html http://127.0.0.1:18080/
          test -s /tmp/hosprime-frontend.html

      - name: Record running service state
        run: docker compose --env-file .env ps

      - name: Capture Compose diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose --env-file .env ps --all || true
          docker compose --env-file .env logs --no-color --timestamps --tail=200 || true

      - name: Stop complete Compose stack
        if: always()
        run: docker compose --env-file .env down --volumes --remove-orphans || true

      - name: Remove ephemeral environment
        if: always()
        run: rm -f .env
