name: M0 secure runtime configuration

on:
  push:
    branches:
      - security/m0-secure-runtime-config
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "backend/app/core/config.py"
      - "backend/app/main.py"
      - "backend/tests/test_secure_runtime_config.py"
      - ".github/workflows/m0-secure-runtime-test.yml"
  pull_request:
    paths:
      - ".env.example"
      - "docker-compose.yml"
      - "backend/app/core/config.py"
      - "backend/app/main.py"
      - "backend/tests/test_secure_runtime_config.py"
      - ".github/workflows/m0-secure-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run secure runtime regression tests
        run: python -m pytest -q backend/tests/test_secure_runtime_config.py

      - name: Create ephemeral CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=development
          POSTGRES_DB=hosprime
          POSTGRES_USER=hosprime
          POSTGRES_PASSWORD=ci-postgres-password-not-for-production
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://hosprime:ci-postgres-password-not-for-production@postgres:5432/hosprime
          POSTGRES_URL=postgresql://hosprime:ci-postgres-password-not-for-production@postgres:5432/hosprime
          REDIS_URL=redis://redis:6379/0
          REDIS_PORT=6379
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ci-neo4j-password-not-for-production
          NEO4J_HTTP_PORT=7474
          NEO4J_BOLT_PORT=7687
          GEMINI_API_KEY=ci-provider-key-not-for-production
          JWT_SECRET=ci-only-jwt-secret-with-more-than-thirty-two-characters
          CORS_ORIGINS=["http://localhost"]
          BACKEND_PORT=8000
          FRONTEND_PORT=80
          EOF

      - name: Validate resolved Compose model
        run: docker compose --env-file .env config --quiet

      - name: Build deployable images
        run: docker compose --env-file .env build

      - name: Remove ephemeral environment
        if: always()
        run: rm -f .env
