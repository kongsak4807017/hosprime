name: Secret regression scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete pull-request secret gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/verify_secret_gate.py --git-range "${BASE_SHA}...${HEAD_SHA}"

      - name: Run complete pushed secret gate
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            python scripts/verify_secret_gate.py
          else
            python scripts/verify_secret_gate.py --git-range "${BEFORE_SHA}...${HEAD_SHA}"
          fi

      - name: Run complete manual secret gate
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_secret_gate.py
