name: Secret regression scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner unit tests
        run: python -m unittest discover -v -s backend/tests -p "test_secret*.py"

      - name: Reject prohibited credential artifacts
        run: python scripts/secret_artifact_gate.py

      - name: Scan complete tracked tree
        run: python scripts/secret_scan_entry.py

      - name: Scan pull-request additions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/secret_scan_entry.py --git-range "${BASE_SHA}...${HEAD_SHA}" --diff-only

      - name: Scan pushed additions
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            python scripts/secret_scan_entry.py
          else
            python scripts/secret_scan_entry.py --git-range "${BEFORE_SHA}...${HEAD_SHA}" --diff-only
          fi
