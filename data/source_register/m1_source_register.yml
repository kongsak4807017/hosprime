# M1 Governed Knowledge Oracle — Source Readiness Register
# Purpose: seed a measurable, auditable register before ingestion, embedding or indexing.
# Boundary: placeholder records are DISCOVERED only and must not be treated as approved Organizational RAG evidence.

schema_version: 1
register_id: M1-A-SOURCE-REGISTER
release_target: M1 Governed Knowledge Oracle MVP
north_star_metric: Trusted Task Completion Rate
baseline_metric: M1-A Source Readiness Baseline Coverage
required_records_target: 100
seed_records_count: 5
allowed_lifecycle_states:
  - DISCOVERED
  - QUARANTINED
  - PARSED
  - CLASSIFIED
  - QUALITY_CHECKED
  - REVIEW_PENDING
  - APPROVED
  - INDEX_READY
  - INDEXED
  - REJECTED
  - EXPIRED
allowed_seed_lifecycle_states:
  - DISCOVERED
  - QUARANTINED
active_rag_activation_allowed: false
human_approval_required_for_approved_state: true

