version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: hosprime_postgres
    restart: always
    environment:
      POSTGRES_DB: hosprime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hosprime_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.18.0-community
    container_name: hosprime_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosprime_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hosprime
      - POSTGRES_URL=postgresql://postgres:postgrespassword@postgres:5432/hosprime
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - GEMINI_API_KEY=AIzaSyDGql9VM_5aWG-i57xLchiueyM2GkuN9nc
      - JWT_SECRET=hosprime-super-secret-key-enterprise
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - ./storage:/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosprime_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
