# M0.3 Trial Readiness Record Template
# Non-executing control artifact. This file does not authorize a trial, record
# consent, open an execution window, prove runtime success, or mark M0.3 done.
# Missing, blank, pending, expired, revoked, invalid, or conflicted evidence
# must always derive TRIAL_READY = false.

record_control:
  schema_name: "M0_3_TRIAL_READINESS_RECORD"
  schema_version: "0.1"
  record_id: null
  created_at: null
  updated_at: null
  lifecycle_state: "DRAFT" # DRAFT, PENDING_REVIEW, APPROVED_NOT_ACTIVE, ACTIVE_WITHIN_WINDOW, REVOKED, EXPIRED, CLOSED
  controlling_issue: "https://github.com/kongsak4807017/hosprime/issues/158"
  milestone: "M0.3 Obsidian-compatible graph memory"
  plan_evidence: "engineering_runs/2026-07-11/0200-m0-3-trial-readiness-plan.md"
  evidence_custodian_identity_or_role_ref: null

scope_boundary:
  trial_purpose: "Observe whether a consenting healthcare/public-health manager can independently navigate the synthetic meeting-to-decision-to-task-or-source-to-lesson chain in Obsidian."
  allowed_fixture_root: "storage/personal_memory/example-person/vault"
  synthetic_data_only_required: true
  real_personal_staff_patient_or_confidential_data_allowed: false
  fixture_mutation_allowed: false
  rag_activation_allowed: false
  organizational_memory_promotion_allowed: false
  high_impact_action_allowed: false
  runtime_execution_recorded_by_this_template: false
  participant_performance_conclusions_allowed: false

# Core gate states: MISSING, PENDING, COMPLETE, INVALID, EXPIRED, REVOKED, CONFLICTED.
# NOT_APPLICABLE is prohibited for all eight core gates.
