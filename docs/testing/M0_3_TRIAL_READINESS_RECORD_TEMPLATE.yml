derived_readiness:
  evaluator_name: null
  evaluator_version: null
  evaluated_at: null
  gate_validity:
    gate_1_authorization: false
    gate_2_executor_delegation: false
    gate_3_participant_consent: false
    gate_4_acceptance_authority: false
    gate_5_runtime_environment: false
    gate_6_repository_and_fixture: false
    gate_7_synthetic_scope_acknowledgement: false
    gate_8_audit_and_evidence_package: false
  invalid_or_pending_reasons:
    - "Record is a draft template; no trial-specific evidence has been supplied."
  trial_ready: false
  derivation_rule_summary: >-
    trial_ready may become true only when lifecycle state is APPROVED_NOT_ACTIVE
    or ACTIVE_WITHIN_WINDOW; all eight core gates are COMPLETE with non-empty,
    current, consistent and reviewable evidence; authorization and consent are
    current and not revoked or withdrawn; repository SHA and fixture integrity
    are verified; synthetic acknowledgements align; retention authority is
    assigned; the evidence package is opened; no unresolved role conflict
    exists; and no prohibited data or action flag is true.
  default_fail_closed: true
  explicit_non_claims:
    trial_authorized_by_template: false
    participant_consented_by_template: false
    trial_executed: false
    runtime_success_observed: false
    manager_task_accepted: false
    trusted_task_completion_rate_computable: false
    trusted_task_completion_rate_improved: false
    time_saved_observed: false
    m0_3_done: false

stop_conditions:
  stop_if_any_core_gate_not_complete: true
  stop_if_evidence_reference_missing: true
  stop_if_authorization_expired_or_revoked: true
  stop_if_consent_missing_or_withdrawn: true
  stop_if_repository_sha_missing_or_mutable: true
  stop_if_fixture_integrity_fails: true
  stop_if_role_conflict_unresolved: true
  stop_if_retention_authority_unassigned: true
  stop_if_prohibited_data_or_action_detected: true
